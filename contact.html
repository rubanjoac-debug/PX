<!-- CONTACT.HTML -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Contact | PhenomX</title>

  <link rel="stylesheet" href="style.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
</head>
<body>

<header>
  <div class="logo">
    <img src="images/logo.png">
    <h2>PHENOM<span>X</span></h2>
  </div>

  <nav id="navMenu">
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="services.html">Services</a>
    <a href="portfolio.html">Portfolio</a>
    <a href="contact.html">Contact</a>
  </nav>

  <div class="menu-btn" id="menuBtn">
    <i class="fa-solid fa-bars"></i>
  </div>
</header>

<section class="page-hero">
  <h1>Get In Touch</h1>
</section>

<section class="contact-page">

  <div class="contact-grid">

    <div class="contact-info">

      <h2>Let's Build Something Great</h2>

      <p>
        Ready to grow your business with powerful
        branding and modern digital solutions?
      </p>

      <div class="info-box">
        <i class="fa-solid fa-envelope"></i>
        <span>hello@phenomx.com</span>
      </div>

      <div class="info-box">
        <i class="fa-solid fa-phone"></i>
        <span>+256 XXX XXX XXX</span>
      </div>

      <div class="info-box">
        <i class="fa-solid fa-location-dot"></i>
        <span>Uganda</span>
      </div>

    </div>

    <form
action="https://formsubmit.co/YOUR_EMAIL@gmail.com"
method="POST"
class="contact-form">

  <!-- Disable Captcha -->
  <input type="hidden" name="_captcha" value="false">

  <!-- Email Subject -->
  <input type="hidden" name="_subject" value="New PhenomX Website Message">

  <!-- Redirect After Submit -->
  <input type="hidden" name="_next" value="thankyou.html">

  <input
  type="text"
  name="name"
  placeholder="Your Name"
  required>

  <input
  type="email"
  name="email"
  placeholder="Your Email"
  required>

  <textarea
  name="message"
  rows="6"
  placeholder="Your Message"
  required></textarea>

  <button type="submit">
    Send Message
  </button>

    </form>

  </div>

</section>

<footer>

  <div class="socials">
    <a href="#"><i class="fab fa-facebook-f"></i></a>
    <a href="#"><i class="fab fa-twitter"></i></a>
    <a href="#"><i class="fab fa-linkedin-in"></i></a>
    <a href="#"><i class="fab fa-instagram"></i></a>
  </div>

  <p>© 2026 PhenomX. All Rights Reserved.</p>

</footer>

<script src="script.js"></script>

</body>
</html>
